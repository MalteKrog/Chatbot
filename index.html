<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>AMAbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <!-- Chat historik -->
    <div class="header">
      <div class="text-header">
        <h1>Malte Krog AMAbot</h1>
        <p>Skriv dit navn, for at komme i gang</p>
      </div>
     <form class="name-form">
        <input type="text" id="nameInput" placeholder="Skriv dit navn..." />
        <button id="send-button" type="submit">Start</button>
      </form>
    </div>
    <section class="chat-container">

      <div class="malte">
        <img src="assets/malte.jpg" alt="Malte Krog" />
        <p>Hej! Jeg er Malte Krog... bla bla</p>
      </div>
      <div class="chat">
        <div class="message bot">
          <span class="label">MalteBot</span>
          Hej! Stil mig et spørgsmål, så svarer jeg så godt jeg kan.
        </div>
        
        <div class="message user">
          <span class="label">{user}</span>
  
        </div>
      </div>
    </section>
    <form class="composer">
      <input type="text" placeholder="Skriv din besked..." />
      <!-- Button skal push spørgsmål -->
      <button id="send-button" type="submit" onclick="sendMessage()">Send</button>
    </form>
    <!-- Logik når der ikke er stillet et spørgsmål + gør det dynamisk med sender og server -->

  </main>
  <script src="script.js"></script>
</body>
</html>

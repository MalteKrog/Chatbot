<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AMAbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Malte Krog AMAbot</h1>
      <p>Stil mig et spørgsmål og lær mig at kende</p>
    </div>
    <div class="chat">
      <div class="message bot">
        <span class="label">MalteBot</span>
        Hej! Stil mig et spørgsmål, så svarer jeg så godt jeg kan.
      </div>

      <div class="message user">
        <span class="label">User</span>
        Hvad er forskellen på GET og POST?
      </div>

      <div class="message bot">
        <p class="label">MalteBot</p>
        <p class="">GET henter data, mens POST sender data til serveren.</p>
      </div>
    </div>

    <form class="composer">
      <input type="text" placeholder="Skriv din besked..." />
      <button type="submit">Send</button>
    </form>
  </div>
</body>
</html>

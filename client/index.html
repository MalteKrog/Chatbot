<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AMAbot</title>
  <link rel="stylesheet" href="public/style.css" />
  <script src="public/script.js" defer></script>
</head>
<body>
  <div class="app">

    <header class="header">
      <img class="avatar" src="public/assets/malte.jpg" alt="Malte Krog" />
      <div class="header-text">
        <h1>Malte Krog AMAbot</h1>
        <p class="status"><span class="dot"></span>Online · stil mig et spørgsmål</p>
      </div>
      <button type="button" id="clear-messages-button" class="clear-button">Ryd beskeder</button>
    </header>

    <!-- script.js fylder beskeder ind her -->
    <main class="chat" id="messages" aria-live="polite"></main>

    <footer class="composer-wrap">
      <form class="composer" id="question-form" autocomplete="off">
        <input id="question" type="text" name="question" placeholder="Skriv en besked..." />
        <button id="send-button" class="send" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path d="M3.4 20.4 21 12 3.4 3.6l-.1 6.5L15 12 3.3 13.9z" />
          </svg>
        </button>
      </form>
      <div class="char-counter" id="char-counter">
        <span id="char-count">0</span>/280
      </div>
    </footer>

  </div>
</body>
</html>

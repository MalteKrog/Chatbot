<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>AMAbot</title>
  <link rel="stylesheet" href="public/style.css" />
  <script src="public/script.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">

    <div class="header">
      <div class="text-header">
        <h1>Malte Krog AMAbot</h1>
        <p>Stil mig et spørgsmål, så svarer jeg så godt jeg kan</p>
      </div>
    </div>

    <section class="chat-container">
      <div class="malte">
        <img src="public/assets/malte.jpg" alt="Malte Krog" />
        <p>Hej! Jeg er Malte Krog... bla bla</p>
      </div>

      <!-- Tom container: script.js fylder beskeder ind her -->
      <div class="chat" id="messages"></div>
    </section>

    <form class="composer" id="question-form">
      <input id="question" type="text" name="question" placeholder="Skriv din besked..." />
      <button id="send-button" type="submit">Send</button>
    </form>

    <div class="char-counter" id="char-counter">
      <span id="char-count">0</span>/280
    </div>

    <button type="button" id="clear-messages-button">Ryd beskeder</button>

  </main>
</body>
</html>
